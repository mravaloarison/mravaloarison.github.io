# Icon shown in each tech pill on project pages. Keys are the exact names used
# in a project's `tech:` list; values are files in _includes/tech-icons/.
# Brand logos are from Simple Icons (CC0); generic ones are from Lucide (ISC),
# used where a brand has no free logo (Microsoft apps, OpenAI, Twilio, PixiJS…)
# or the item is a concept. Anything not listed gets code.svg.
#
# To add one: save the SVG into _includes/tech-icons/ with fill="currentColor"
# (or stroke="currentColor" for line icons), class="pill-icon", width/height 14,
# aria-hidden="true", then add the name here.

