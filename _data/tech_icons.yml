# Icon and link for each technology. Keys are the exact names used in a
# project's `tech:` list.
#   icon: PNG in /assets/icons/tech/ (without .png); unlisted tech gets source-code
#   url:  official site or docs; the tech links there on project pages (optional)
#
# Icons are from Icons8 (https://icons8.com), "Color" style, 48px PNG. The free
# licence requires the "Icons by Icons8" link in the footer — keep it.
#
# To add one: find the icon on icons8.com (Color style), download it with
#   curl -o assets/icons/tech/<name>.png https://img.icons8.com/color/48/<name>.png
# then add the tech name here with its icon and url.

