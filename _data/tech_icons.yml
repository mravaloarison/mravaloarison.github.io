# Icon for each technology, shown in the tech pills on project pages and as a
# row of icons on project cards. Keys are the exact names used in a project's
# `tech:` list; values are PNGs in /assets/icons/tech/ (without .png).
# Anything not listed gets source-code.png.
#
# Icons are from Icons8 (https://icons8.com), "Color" style, 48px PNG. The free
# licence requires the "Icons by Icons8" link in the footer — keep it.
#
# To add one: find the icon on icons8.com (Color style), download it with
#   curl -o assets/icons/tech/<name>.png https://img.icons8.com/color/48/<name>.png
# then add the tech name here.

