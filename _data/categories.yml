arts:
  # Arts' two subcategories (Mami's request, November 2026: drawings and
  # animations, that's all), in the order they appear in the menu and on
  # /arts/. Drawings holds the `arts` collection, every `medium` listed under
  # it (hand drawn and Procreate together, in one gallery order); Animated
  # holds the `animations` collection. Each has a page at /arts/<slug>/.
  - name: Drawings
    slug: drawings
    label: Drawings
    collection: arts
    mediums: [Hand drawn, Procreate]
    items_label: drawings
  - name: Animated
    slug: animated
    label: Animated
    collection: animations
    items_label: animations
