<head>
  <script>
    (function () {
      var el = document.documentElement;
      var depth = Number(el.dataset.navDepth || 0);
      var prev = null;
      try { prev = sessionStorage.getItem('navDepth'); } catch (e) {}
      if (prev !== null) {
        var p = Number(prev);
        if (depth > p) el.dataset.navDir = 'forward';
        else if (depth < p) el.dataset.navDir = 'back';
      }
      try { sessionStorage.setItem('navDepth', String(depth)); } catch (e) {}
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.homepage %}{{ page.title }}{% elsif page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
  {% seo title=false %}
  {% feed_meta %}
  {% include json-ld.html %}
  <!-- Google Search Console verification meta tag goes here -->
</head>
