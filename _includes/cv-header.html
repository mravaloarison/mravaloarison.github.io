<!-- Header -->
    
    <div class="flex gap-4">

        <!-- Left -->
        <div class="mb-4 mb-lg-0">

            <h1 class="h4 fw-medium mb-2">
                {{ site.first_name }} {{ site.last_name }}
            </h1>

            <div class="text-muted small mb-3">
                <div>Software Engineer</div>
                <div>{{ site.location }}</div>
            </div>
            <div class="mb-3">
                <a href="mailto:{{ site.email }}" class="text-decoration-none">
                    <i class="bi bi-envelope-fill me-1"></i>
                    {{ site.email }}
                </a>
            </div>

            <div class="d-flex flex-wrap align-items-center gap-2 small text-muted mb-3">
                <a href="https://linkedin.com/in/{{ site.linkedin }}" target="_blank"
                    class="text-decoration-none text-muted">
                    <i class="bi bi-linkedin me-1"></i> LinkedIn
                </a>

                <span class="opacity-50">•</span>

                <a href="https://github.com/{{ site.github }}" target="_blank" class="text-decoration-none text-muted">
                    <i class="bi bi-github me-1"></i> GitHub
                </a>
            </div>

            <!-- Right -->
            <div>
                <a href="{{ site.cv_pdf }}" class="btn btn-outline-secondary" target="_blank">
                    <i class="bi bi-box-arrow-up-right me-1"></i> Resume
                </a>
            </div>
        </div>

        

    </div>

    <hr class="my-5 my-lg-4">
