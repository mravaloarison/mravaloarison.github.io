<div class="card-grid">
  {% for item in include.items %}
  <a class="card" href="{{ item.url | relative_url }}">
    {% if item.image %}
    {% include picture.html src=item.image alt=item.image_alt sizes="(max-width: 600px) calc(100vw - 32px), 400px" %}
    {% endif %}
    <div class="card-body">
      <h3>{{ item.title }}</h3>
      <p class="card-description">{{ item.description }}</p>
      {% if item.tech %}<p class="meta">{{ item.tech | join: " · " }}</p>{% endif %}
    </div>
  </a>
  {% endfor %}
</div>
