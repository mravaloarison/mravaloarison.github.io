{% if include.tech or include.award or include.status %}
<div class="metadata-row">
  {% if include.status == "ongoing" %}<span class="pill pill-status">In progress</span>{% endif %}
  {% if include.award %}<span class="pill pill-award">{{ include.award }}</span>{% endif %}
  {%- for t in include.tech %}
  <span class="pill pill-tech">{% include tech-icon.html name=t %}{{ t }}</span>
  {%- endfor %}
</div>
{% endif %}
