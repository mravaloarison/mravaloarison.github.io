<nav class="breadcrumb" aria-label="Breadcrumb">
  <ol>
    <li><a href="{{ '/' | relative_url }}">Home</a></li>
    {% if include.section_title %}
    <li><a href="{{ include.section_url | relative_url }}">{{ include.section_title }}</a></li>
    {% endif %}
    <li aria-current="page">{{ include.current }}</li>
  </ol>
</nav>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "Home", "item": {{ "/" | absolute_url | jsonify }}}
    {% if include.section_title %}
    ,{"@type": "ListItem", "position": 2, "name": {{ include.section_title | jsonify }}, "item": {{ include.section_url | absolute_url | jsonify }}}
    {% endif %}
    ,{"@type": "ListItem", "position": {% if include.section_title %}3{% else %}2{% endif %}, "name": {{ include.current | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}
  ]
}
</script>
