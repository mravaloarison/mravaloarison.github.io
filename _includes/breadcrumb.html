<nav class="breadcrumb" aria-label="Breadcrumb">
  <ol>
    <li><a href="{{ '/' | relative_url }}">Home</a></li>
    {% if include.section_title %}
    <li><a href="{{ include.section_url | relative_url }}">{{ include.section_title }}</a></li>
    {% endif %}
    {% if include.category_title %}
    <li><a href="{{ include.category_url | relative_url }}">{{ include.category_title }}</a></li>
    {% endif %}
    <li aria-current="page">{{ include.current }}</li>
  </ol>
</nav>

{% assign crumb_pos = 1 %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "Home", "item": {{ "/" | absolute_url | jsonify }}}
    {% if include.section_title %}
    {% assign crumb_pos = crumb_pos | plus: 1 %}
    ,{"@type": "ListItem", "position": {{ crumb_pos }}, "name": {{ include.section_title | jsonify }}, "item": {{ include.section_url | absolute_url | jsonify }}}
    {% endif %}
    {% if include.category_title %}
    {% assign crumb_pos = crumb_pos | plus: 1 %}
    ,{"@type": "ListItem", "position": {{ crumb_pos }}, "name": {{ include.category_title | jsonify }}, "item": {{ include.category_url | absolute_url | jsonify }}}
    {% endif %}
    {% assign crumb_pos = crumb_pos | plus: 1 %}
    ,{"@type": "ListItem", "position": {{ crumb_pos }}, "name": {{ include.current | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}
  ]
}
</script>
