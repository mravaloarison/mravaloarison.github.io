{%- comment -%} Line icons for the picture viewer. Param: name (close | info | prev | next | replay). {%- endcomment -%}
{%- case include.name -%}

{%- when "info" -%}<svg class="viewer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle class="viewer-icon-dot" cx="12" cy="7.6" r="1.1"/></svg>

{%- when "replay" -%}<svg class="viewer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.8 13.2A8.2 8.2 0 1 0 6.2 6.2L3.8 8.6"/><path d="M3.8 3.8v4.8h4.8"/></svg>
