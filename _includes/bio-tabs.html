{%- comment -%}
  Short | Long, the two About pages, on the PORTFOLIO row above the name
  (page-header.html tabs=...). Plain links, so they work with JavaScript
  off; the page you're on gets aria-current.
{%- endcomment -%}
<nav class="bio-tabs" aria-label="Bio length">
  <a href="{{ '/' | relative_url }}"{% if include.current == "short" %} aria-current="page"{% endif %}>Short</a>
  <span class="bio-tabs-sep" aria-hidden="true">|</span>
  <a href="{{ '/bio/' | relative_url }}"{% if include.current == "long" %} aria-current="page"{% endif %}>Long</a>
</nav>
